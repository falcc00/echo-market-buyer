<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo UA Airliner Market by VAFeed</title>
    <link rel="icon" type="image/png" href="echo_logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0B0F17">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Echo Market">
    <link rel="apple-touch-icon" href="echo_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        wondr: {
                            lime: '#334155', limeHover: '#475569', orange: '#38BDF8',
                            cardOrange: '#0F172A', cardTeal: '#1E293B', darkBg: '#090D16',
                            grayBg: '#0F172A', cardBorder: '#1E293B', subtext: '#94A3B8', navy: '#030712'
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s infinite alternate',
                        'float': 'float 3.5s ease-in-out infinite',
                        'shimmer': 'shimmer 2s infinite linear',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'slide-in-right': 'slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'marquee': 'marquee 30s linear infinite',
                        'reveal': 'reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        pulseGlow: { '0%': { boxShadow: '0 0 10px rgba(255, 255, 255, 0.1)' }, '100%': { boxShadow: '0 0 25px rgba(255, 255, 255, 0.3)' } },
                        float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-6px)' } },
                        shimmer: { '0%': { transform: 'translateX(-100%)' }, '100%': { transform: 'translateX(100%)' } },
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        slideInRight: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(0)' } },
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        pop: { '0%': { transform: 'scale(0.9)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        marquee: { '0%': { transform: 'translateX(0)' }, '100%': { transform: 'translateX(-50%)' } },
                        reveal: { '0%': { transform: 'translateY(40px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0F17; color: #F8FAFC; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0F172A; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* === landonorris-inspired utilities === */
        .ln-headline {
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.95;
        }
        .ln-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .ln-underline-link {
            position: relative;
            display: inline-block;
        }
        .ln-underline-link::after {
            content: '';
            position: absolute;
            left: 0; bottom: -2px;
            width: 0; height: 1px;
            background: currentColor;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ln-underline-link:hover::after { width: 100%; }

        .ln-card {
            background: #0F172A;
            border: 1px solid #1E293B;
            border-radius: 28px;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ln-card:hover {
            border-color: #334155;
            transform: translateY(-4px);
        }

        .ln-pill {
            border-radius: 999px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .ln-pill:hover { transform: scale(1.03); }
        .ln-pill:active { transform: scale(0.97); }

        .ln-marquee-mask {
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }

        .ln-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #1E293B 20%, #1E293B 80%, transparent);
        }

        .ln-noice {
            background-image: radial-gradient(circle at 1px 1px, rgba(148,163,184,0.08) 1px, transparent 0);
            background-size: 24px 24px;
        }

        @media (max-width: 768px) {
            .ln-headline { letter-spacing: -0.03em; }
        }
    </style>

<body class="selection:bg-slate-700 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const ALLIANCES = ['Kyra', 'Proxima', 'Aegis', 'Elysium', 'Rhea', 'Vilis', 'Elion', 'Aura', 'Eos'];
        const PRICE_PERCENT_OPTIONS = [100, 90, 80, 70, 60, 50];

        const LS_AIRLINES = 'echo_airlines_list';
        const LS_ACTIVE = 'echo_active_airline';
        const LS_CART = 'echo_cart_items';
        const LS_NOTIF_PERM = 'echo_notif_permission_asked';
        const LS_ORDER_SNAPSHOTS = 'echo_order_snapshots';
        const LS_OWNER_KEY = 'echo_owner_key';
        const LS_DAILY_LIMIT = 'echo_daily_purchase_limit';
        const DAILY_LIMIT_USD = 10_000_000_000;

        let memoryOwnerKey = '';
        function getOwnerKey() {
            try {
                let k = localStorage.getItem(LS_OWNER_KEY);
                if (!k || !/^[A-Za-z0-9_-]{32,128}$/.test(k)) {
                    k = memoryOwnerKey || (() => {
                        const bytes = new Uint8Array(24);
                        crypto.getRandomValues(bytes);
                        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
                    })();
                    localStorage.setItem(LS_OWNER_KEY, k);
                }
                memoryOwnerKey = k;
                return k;
            } catch (e) {
                if (!memoryOwnerKey) {
                    const bytes = new Uint8Array(24);
                    crypto.getRandomValues(bytes);
                    memoryOwnerKey = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
                }
                return memoryOwnerKey;
            }
        }

        function getTodayKey() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getDailySpent() {
            try {
                const raw = JSON.parse(localStorage.getItem(LS_DAILY_LIMIT) || '{}');
                if (!raw || raw.date !== getTodayKey()) return 0;
                const n = Number(raw.spentUSD);
                return Number.isFinite(n) && n > 0 ? n : 0;
            } catch (e) { return 0; }
        }

        function setDailySpent(amount) {
            try {
                localStorage.setItem(LS_DAILY_LIMIT, JSON.stringify({
                    date: getTodayKey(),
                    spentUSD: Math.max(0, Number(amount) || 0)
                }));
            } catch (e) { console.error('Failed to save daily limit:', e); }
        }

        function addDailySpent(amount) {
            const next = getDailySpent() + (Number(amount) || 0);
            setDailySpent(next);
            return next;
        }

        function checkDailyLimit(requestedUSD) {
            const spent = getDailySpent();
            const remaining = Math.max(0, DAILY_LIMIT_USD - spent);
            if (requestedUSD > remaining) {
                return { ok: false, remaining, requested: requestedUSD, limit: DAILY_LIMIT_USD, spent };
            }
            return { ok: true, remaining, spent };
        }

        function formatLimitAlert(info) {
            const f = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(v);
            return `Daily purchase limit exceeded.\n\nLimit per day: ${f(info.limit)}\nAlready spent today: ${f(info.spent)}\nRemaining today: ${f(info.remaining)}\nThis order: ${f(info.requested)}\n\nYou can place the remaining order tomorrow, or reduce the quantity / price percent.`;
        }

        function App() {
            const [activeView, setActiveView] = useState('home');
            const [selectedCategory, setSelectedCategory] = useState('ALL');
            const [selectedPricePercent, setSelectedPricePercent] = useState(100);
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('price-asc');
            const [selectedAircraft, setSelectedAircraft] = useState(null);
            const [orderQty, setOrderQty] = useState(1);
            const [isNotifModalOpen, setIsNotifModalOpen] = useState(false);
            const [orderHistory, setOrderHistory] = useState([]);
            const [lastOrder, setLastOrder] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const [buyerNote, setBuyerNote] = useState('');

            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [dailySpent, setDailySpentState] = useState(() => getDailySpent());

            const [airlines, setAirlines] = useState([]);
            const [activeAirlineIndex, setActiveAirlineIndex] = useState(-1);
            const [isChangeAirlineOpen, setIsChangeAirlineOpen] = useState(false);
            const [isAddAirlineOpen, setIsAddAirlineOpen] = useState(false);
            const [newAirlineInput, setNewAirlineInput] = useState('');
            const [newAirlineAlliance, setNewAirlineAlliance] = useState('');

            const [aircraftDatabase, setAircraftDatabase] = useState([]);
            const [isLoadingAircraft, setIsLoadingAircraft] = useState(true);

            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isCartHydrated, setIsCartHydrated] = useState(false);

            const [notifPermission, setNotifPermission] = useState('default');
            const [isNotifPermBannerOpen, setIsNotifPermBannerOpen] = useState(false);
            const orderSnapshotsRef = useRef({});
            const notifPermissionRef = useRef('default');

            const [notifications, setNotifications] = useState([
                {
                    id: 1,
                    title: 'Welcome to Echo UA Airliner Market',
                    desc: 'Official commercial aircraft fleet ordering platform with the best fleet quota prices.',
                    time: 'Just now',
                    unread: true,
                    type: 'info'
                }
            ]);

            const refreshDailySpentUI = () => setDailySpentState(getDailySpent());
            useEffect(() => { refreshDailySpentUI(); }, [activeView]);

            useEffect(() => {
                try {
                    const storedAirlines = JSON.parse(localStorage.getItem(LS_AIRLINES) || '[]');
                    const storedActive = parseInt(localStorage.getItem(LS_ACTIVE) || '-1', 10);
                    if (Array.isArray(storedAirlines) && storedAirlines.length > 0) {
                        const normalized = storedAirlines.map(a => ({ name: a.name || '', alliance: a.alliance || '' }));
                        setAirlines(normalized);
                        setActiveAirlineIndex(storedActive >= 0 && storedActive < normalized.length ? storedActive : 0);
                    }
                } catch (e) { console.error('Failed to load airlines:', e); }
            }, []);

            useEffect(() => {
                if (airlines.length > 0 || localStorage.getItem(LS_AIRLINES)) {
                    localStorage.setItem(LS_AIRLINES, JSON.stringify(airlines));
                    localStorage.setItem(LS_ACTIVE, String(activeAirlineIndex));
                }
            }, [airlines, activeAirlineIndex]);

            useEffect(() => {
                try {
                    const storedCart = JSON.parse(localStorage.getItem(LS_CART) || '[]');
                    if (Array.isArray(storedCart)) {
                        const validCart = storedCart.filter(it =>
                            it && it.aircraft && typeof it.qty === 'number' && it.qty > 0
                        ).map(it => ({
                            id: it.id || (Date.now() + Math.random()),
                            aircraft: it.aircraft,
                            qty: it.qty,
                            pricePercent: typeof it.pricePercent === 'number' ? it.pricePercent : 100,
                            note: it.note || ''
                        }));
                        setCart(validCart);
                    }
                } catch (e) { console.error('Failed to load cart:', e); }
                finally { setIsCartHydrated(true); }
            }, []);

            useEffect(() => {
                if (!isCartHydrated) return;
                try { localStorage.setItem(LS_CART, JSON.stringify(cart)); }
                catch (e) { console.error('Failed to save cart:', e); }
            }, [cart, isCartHydrated]);

            useEffect(() => {
                if (!('serviceWorker' in navigator)) return;
                navigator.serviceWorker.register('sw.js').catch(e => console.error('Service worker register failed:', e));
            }, []);

            useEffect(() => {
                if (!('Notification' in window)) return;
                const sync = () => {
                    setNotifPermission(Notification.permission);
                    notifPermissionRef.current = Notification.permission;
                    if (Notification.permission === 'granted') ensurePushSubscription();
                };
                window.addEventListener('focus', sync);
                document.addEventListener('visibilitychange', sync);
                return () => {
                    window.removeEventListener('focus', sync);
                    document.removeEventListener('visibilitychange', sync);
                };
            }, []);

            useEffect(() => {
                if (!('Notification' in window)) return;
                const current = Notification.permission;
                setNotifPermission(current);
                notifPermissionRef.current = current;
                try {
                    const stored = JSON.parse(localStorage.getItem(LS_ORDER_SNAPSHOTS) || '{}');
                    if (stored && typeof stored === 'object') orderSnapshotsRef.current = stored;
                } catch (e) { console.error('Failed to load order snapshots:', e); }
                if (current === 'granted') setTimeout(() => ensurePushSubscription(), 1500);
                const asked = localStorage.getItem(LS_NOTIF_PERM) === '1';
                if (!asked && current === 'default') setTimeout(() => setIsNotifPermBannerOpen(true), 2500);
            }, []);

            const requestNotifPermission = async () => {
                if (!('Notification' in window)) {
                    showToast('This browser does not support notifications');
                    setIsNotifPermBannerOpen(false);
                    localStorage.setItem(LS_NOTIF_PERM, '1');
                    return;
                }
                try {
                    const perm = await Notification.requestPermission();
                    setNotifPermission(perm);
                    notifPermissionRef.current = perm;
                    localStorage.setItem(LS_NOTIF_PERM, '1');
                    setIsNotifPermBannerOpen(false);
                    if (perm === 'granted') {
                        showToast('Notifications enabled!');
                        ensurePushSubscription();
                        sendBrowserNotification('Echo UA Notifications Enabled', 'You will be notified when your orders are updated by the seller.', 'welcome');
                    } else if (perm === 'denied') {
                        showToast('Notifications blocked. Enable from browser settings.');
                    }
                } catch (e) {
                    console.error('Failed to request notification permission:', e);
                    setIsNotifPermBannerOpen(false);
                    localStorage.setItem(LS_NOTIF_PERM, '1');
                }
            };

            const dismissNotifPermBanner = () => {
                setIsNotifPermBannerOpen(false);
                localStorage.setItem(LS_NOTIF_PERM, '1');
            };

            const getSwRegistration = async () => {
                if (!('serviceWorker' in navigator)) return null;
                try {
                    return await Promise.race([
                        navigator.serviceWorker.ready,
                        new Promise(resolve => setTimeout(() => resolve(null), 2500))
                    ]);
                } catch (e) { return null; }
            };

            const sendBrowserNotification = async (title, body, tag) => {
                if (!('Notification' in window)) return false;
                const perm = Notification.permission;
                notifPermissionRef.current = perm;
                if (perm !== 'granted') return false;
                const options = { body, icon: 'echo_logo.png', tag: tag || ('echo-' + Date.now()), silent: false };
                try {
                    const reg = await getSwRegistration();
                    if (reg && typeof reg.showNotification === 'function') {
                        await reg.showNotification(title, options);
                        return true;
                    }
                } catch (e) { console.error('Service worker notification failed:', e); }
                try {
                    const n = new Notification(title, options);
                    n.onclick = () => { try { window.focus(); } catch (e) {} n.close(); };
                    setTimeout(() => { try { n.close(); } catch (e) {} }, 8000);
                    return true;
                } catch (e) { console.error('Failed to send browser notification:', e); return false; }
            };

            const sendTestNotification = async () => {
                const ok = await sendBrowserNotification('Echo UA Test Notification', 'If you can see this, device notifications are working.', 'echo-test-' + Date.now());
                showToast(ok ? 'Test sent. If nothing appears, check your device notification settings.' : 'Could not show a notification. Check browser & system notification settings.');
            };

            const pushReadyRef = useRef(false);
            const pushUnavailableRef = useRef(false);

            const urlBase64ToUint8Array = (b64) => {
                const pad = '='.repeat((4 - (b64.length % 4)) % 4);
                const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
                const out = new Uint8Array(raw.length);
                for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
                return out;
            };

            const ensurePushSubscription = async () => {
                try {
                    if (pushReadyRef.current || pushUnavailableRef.current) return pushReadyRef.current;
                    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
                    if (!('Notification' in window) || Notification.permission !== 'granted') return false;
                    const reg = await getSwRegistration();
                    if (!reg || !reg.pushManager) return false;
                    const keyRes = await fetch('/api/push');
                    const { publicKey } = await keyRes.json();
                    if (!publicKey) { pushUnavailableRef.current = true; return false; }
                    const appKey = urlBase64ToUint8Array(publicKey);
                    let sub = await reg.pushManager.getSubscription();
                    if (sub && sub.options && sub.options.applicationServerKey) {
                        const cur = new Uint8Array(sub.options.applicationServerKey);
                        const same = cur.length === appKey.length && cur.every((v, i) => v === appKey[i]);
                        if (!same) { await sub.unsubscribe(); sub = null; }
                    }
                    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: appKey });
                    const res = await fetch('/api/push', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-owner-key': getOwnerKey() },
                        body: JSON.stringify(sub.toJSON())
                    });
                    if (res.ok) pushReadyRef.current = true;
                    return res.ok;
                } catch (e) { console.error('Push subscribe failed:', e); return false; }
            };

            const detectOrderChanges = (newOrders) => {
                if (!Array.isArray(newOrders)) return;
                const snapshots = orderSnapshotsRef.current || {};
                let updatedSnapshots = { ...snapshots };
                newOrders.forEach(ord => {
                    const id = ord.orderId;
                    if (!id) return;
                    const prev = snapshots[id];
                    const currentFilled = ord.filled || 0;
                    const currentStatus = ord.status || 'PENDING';
                    const currentSellerNote = ord.sellerNote || '';
                    const currentFlag = ord.flagStatus || 'NORMAL';
                    if (!prev) {
                        updatedSnapshots[id] = { filled: currentFilled, status: currentStatus, sellerNote: currentSellerNote, flagStatus: currentFlag };
                        return;
                    }
                    if (currentFilled !== prev.filled) {
                        const delta = currentFilled - prev.filled;
                        const total = typeof ord.totalQty === 'number' ? ord.totalQty : ord.qty;
                        sendBrowserNotification(`Order ${id} Updated`, `${delta > 0 ? '+' : ''}${delta} unit(s) filled. Progress: ${currentFilled}/${total} (${total > 0 ? Math.round(currentFilled/total*100) : 0}%).`, 'order-' + id + '-filled-' + currentFilled);
                        setNotifications(prevNotifs => [{ id: Date.now() + Math.random(), title: `Order ${id} Progress Updated`, desc: `Seller filled ${delta > 0 ? '+' : ''}${delta} unit(s). Total filled: ${currentFilled}/${total}.`, time: 'Just now', unread: true, type: 'success' }, ...prevNotifs]);
                    }
                    if (currentStatus !== prev.status) {
                        const label = currentStatus === 'FULFILLED' ? 'FULFILLED ✅' : currentStatus === 'PARTIAL' ? 'PARTIAL 🟡' : 'PENDING ⏳';
                        sendBrowserNotification(`Order ${id} Status Changed`, `Your order is now ${label}. ${currentStatus === 'FULFILLED' ? 'All units have been delivered.' : currentStatus === 'PARTIAL' ? 'Partially delivered.' : 'Awaiting processing.'}`, 'order-' + id + '-status-' + currentStatus);
                        setNotifications(prevNotifs => [{ id: Date.now() + Math.random(), title: `Order ${id} ${label}`, desc: `Status update: ${currentStatus === 'FULFILLED' ? 'Order complete!' : currentStatus === 'PARTIAL' ? 'Partially delivered.' : 'Awaiting processing.'}`, time: 'Just now', unread: true, type: currentStatus === 'FULFILLED' ? 'success' : 'info' }, ...prevNotifs]);
                    }
                    if (currentSellerNote && currentSellerNote !== prev.sellerNote) {
                        sendBrowserNotification(`Note from Seller — Order ${id}`, currentSellerNote.length > 120 ? currentSellerNote.slice(0, 120) + '...' : currentSellerNote, 'order-' + id + '-note');
                        setNotifications(prevNotifs => [{ id: Date.now() + Math.random(), title: `New Seller Note on ${id}`, desc: `"${currentSellerNote.length > 100 ? currentSellerNote.slice(0, 100) + '...' : currentSellerNote}"`, time: 'Just now', unread: true, type: 'info' }, ...prevNotifs]);
                    }
                    if (currentFlag !== prev.flagStatus) {
                        if (currentFlag === 'BLACKLISTED' || currentFlag === 'SUSPICIOUS') {
                            sendBrowserNotification(`Order ${id} Flagged`, `Order flagged as ${currentFlag}. Please check with the seller.`, 'order-' + id + '-flag-' + currentFlag);
                            setNotifications(prevNotifs => [{ id: Date.now() + Math.random(), title: `Order ${id} Flagged ${currentFlag}`, desc: `Your order has been flagged. Contact the seller for details.`, time: 'Just now', unread: true, type: 'info' }, ...prevNotifs]);
                        }
                    }
                    updatedSnapshots[id] = { filled: currentFilled, status: currentStatus, sellerNote: currentSellerNote, flagStatus: currentFlag };
                });
                orderSnapshotsRef.current = updatedSnapshots;
                try { localStorage.setItem(LS_ORDER_SNAPSHOTS, JSON.stringify(updatedSnapshots)); }
                catch (e) { console.error('Failed to save order snapshots:', e); }
            };

            useEffect(() => {
                const anyOpen = isSidebarOpen || isCartOpen || isNotifModalOpen || isChangeAirlineOpen || isAddAirlineOpen;
                if (anyOpen) document.body.style.overflow = 'hidden';
                else document.body.style.overflow = '';
                return () => { document.body.style.overflow = ''; };
            }, [isSidebarOpen, isCartOpen, isNotifModalOpen, isChangeAirlineOpen, isAddAirlineOpen]);

            useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') {
                        if (isSidebarOpen) setIsSidebarOpen(false);
                        else if (isCartOpen) setIsCartOpen(false);
                        else if (isNotifModalOpen) setIsNotifModalOpen(false);
                        else if (isChangeAirlineOpen) setIsChangeAirlineOpen(false);
                        else if (isAddAirlineOpen) setIsAddAirlineOpen(false);
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [isSidebarOpen, isCartOpen, isNotifModalOpen, isChangeAirlineOpen, isAddAirlineOpen]);

            useEffect(() => {
                fetch('aircraft_pricelist.json')
                    .then(res => res.json())
                    .then(data => { setAircraftDatabase(data); setIsLoadingAircraft(false); })
                    .catch(err => { console.error('Failed to load pricelist:', err); setIsLoadingAircraft(false); });
            }, []);

            const fetchOrderHistory = async (isFirstFetch = false) => {
                try {
                    const res = await fetch('/api/orders', { headers: { 'x-owner-key': getOwnerKey() } });
                    const data = await res.json();
                    if (Array.isArray(data)) {
                        setOrderHistory(data);
                        if (!isFirstFetch) detectOrderChanges(data);
                        else {
                            const snapshots = {};
                            data.forEach(ord => {
                                if (ord.orderId) {

                                }
                            });
                            orderSnapshotsRef.current = snapshots;
                            try { localStorage.setItem(LS_ORDER_SNAPSHOTS, JSON.stringify(snapshots)); } catch (e) {}
                        }
                    }
                } catch (err) { console.error('Failed to fetch orders:', err); }

            useEffect(() => {
                fetchOrderHistory(true);
                const tick = () => { if (!document.hidden) fetchOrderHistory(false); };

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3000); };
            const formatUSD = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);

            const getPriceAtPercent = (normalPrice, pricePercent) => normalPrice * (pricePercent / 100);

            const filteredAircrafts = useMemo(() => {
                return aircraftDatabase.filter(item => {
                    const matchesCategory = selectedCategory === 'ALL' || item.category === selectedCategory;
                    const q = searchQuery.toLowerCase();
                    const matchesSearch = item.model.toLowerCase().includes(q) || item.code.toLowerCase().includes(q) || item.family.toLowerCase().includes(q);
                    return matchesCategory && matchesSearch;
                }).sort((a, b) => {
                    if (sortBy === 'price-asc') return a.price - b.price;
                    if (sortBy === 'price-desc') return b.price - a.price;
                    if (sortBy === 'range-desc') return b.range - a.range;
                    if (sortBy === 'capacity-desc') return b.seats - a.seats;
                    return 0;
                });
            }, [aircraftDatabase, selectedCategory, searchQuery, sortBy]);

            const featuredAircrafts = useMemo(() => {
                if (aircraftDatabase.length === 0) return [];
                return [...aircraftDatabase].sort(() => 0.5 - Math.random()).slice(0, 3);

            const currentAirline = airlines[activeAirlineIndex] || { name: '', alliance: '' };
            const customAlert = (title, message) => window.alert(`⚠️ ${title}\n\n${message}`);

            const cartTotalItems = useMemo(() => cart.reduce((sum, it) => sum + it.qty, 0), [cart]);
            const cartTotalUSD = useMemo(() => cart.reduce((sum, it) => sum + (getPriceAtPercent(it.aircraft.price, it.pricePercent) * it.qty), 0), [cart]);
            const cartTotalStandard = useMemo(() => cart.reduce((sum, it) => sum + (it.aircraft.price * it.qty), 0), [cart]);

            const addToCart = (aircraft, qty, pricePercent, note) => {
                const existingIdx = cart.findIndex(it => it.aircraft.code === aircraft.code && it.pricePercent === pricePercent);
                if (existingIdx >= 0) {
                    const newCart = [...cart];
                    newCart[existingIdx] = { ...newCart[existingIdx], qty: newCart[existingIdx].qty + qty, note: note || newCart[existingIdx].note };
                    setCart(newCart);
                } else {
                    setCart([...cart, { id: Date.now() + Math.random(), aircraft, qty, pricePercent, note: note || '' }]);
                }
                showToast(`${qty}x ${aircraft.model} added to cart`);
            };

            const updateCartItem = (id, updates) => { setCart(cart.map(it => it.id === id ? { ...it, ...updates } : it)); };
            const removeCartItem = (id) => { setCart(cart.filter(it => it.id !== id)); };
            const clearCart = () => {
                if (cart.length === 0) return;
                if (!window.confirm('Remove all items from cart?')) return;
                setCart([]);
                showToast('Cart cleared');
            };

            const goToOrderWizard = (aircraft) => {
                if (airlines.length === 0) { customAlert('No Airline Registered', 'You must register an airline in Operator Profile before placing an order.'); setActiveView('profile'); return; }
                if (!currentAirline.name || currentAirline.name.trim() === '') { customAlert('Airline Name Required', 'Please fill in your airline name in Operator Profile.'); setActiveView('profile'); return; }
                if (!currentAirline.alliance) { customAlert('Alliance Required', 'Please select an alliance in Operator Profile.'); setActiveView('profile'); return; }
                setSelectedAircraft(aircraft);
                setOrderQty(1);
                setSelectedPricePercent(100);
                setBuyerNote('');
                setActiveView('order-wizard');
            };

            const goToCart = () => {
                if (cart.length === 0) { customAlert('Cart Empty', 'Add at least one aircraft to cart before checkout.'); return; }
                if (airlines.length === 0) { customAlert('No Airline Registered', 'You must register an airline in Operator Profile before placing an order.'); setActiveView('profile'); return; }
                if (!currentAirline.name || currentAirline.name.trim() === '') { customAlert('Airline Name Required', 'Please fill in your airline name in Operator Profile.'); setActiveView('profile'); return; }
                if (!currentAirline.alliance) { customAlert('Alliance Required', 'Please select an alliance in Operator Profile.'); setActiveView('profile'); return; }
                setBuyerNote('');
                setActiveView('cart-checkout');
            };

            const addAirline = () => {
                const trimmed = newAirlineInput.trim();
                if (!trimmed) { customAlert('Empty Name', 'Please enter a valid airline name.'); return; }
                if (airlines.length >= 6) { customAlert('Limit Reached', 'Max 6 airlines.'); return; }
                if (airlines.some(a => a.name.toLowerCase() === trimmed.toLowerCase())) { customAlert('Duplicate Name', 'Airline already exists.'); return; }
                const newList = [...airlines, { name: trimmed, alliance: newAirlineAlliance }];
                setAirlines(newList);
                setActiveAirlineIndex(newList.length - 1);
                setNewAirlineInput(''); setNewAirlineAlliance('');
                setIsAddAirlineOpen(false);
                showToast(`Airline "${trimmed}" added!`);

            const updateCurrentAirlineName = (newName) => {

                const newList = [...airlines];
                newList[activeAirlineIndex] = { ...newList[activeAirlineIndex], name: trimmed };

                    pricePercent: it.pricePercent,

                    airlineName: currentAirline.name.trim() || 'Unknown',
                    alliance: currentAirline.alliance || '',

                    aircraft: items[0].aircraft,

                    pricePercent: items[0].pricePercent,

            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
