<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We've Moved - Domain Change Notice</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    padding: 24px;
    color: #e5e5e5;
  }

  .container {
    max-width: 480px;
    width: 100%;
    text-align: center;
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #737373;
    border: 1px solid #262626;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 32px;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    color: #fafafa;
  }

  p {
    font-size: 15px;
    line-height: 1.7;
    color: #8a8a8a;
    margin-bottom: 32px;
  }

  .domain-box {
    border: 1px solid #262626;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 32px;
    background: #111111;
    transition: border-color 0.3s;
  }

  .domain-box:hover {
    border-color: #404040;
  }

  .domain-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #525252;
    margin-bottom: 10px;
  }

  .domain-link {
    color: #fafafa;
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    word-break: break-all;
    transition: color 0.3s;
  }

  .domain-link:hover {
    color: #a3a3a3;
  }

  .btn {
    display: inline-block;
    background: #fafafa;
    color: #0a0a0a;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    transition: background 0.25s, transform 0.25s;
  }

  .btn:hover {
    background: #d4d4d4;
    transform: translateY(-1px);
  }

  .note {
    font-size: 13px;
    color: #525252;
    margin-top: 40px;
    line-height: 1.6;
  }

  .countdown {
    color: #a3a3a3;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  @media (max-width: 480px) {
    h1 { font-size: 23px; }
    .domain-link { font-size: 14px; }
    .btn { width: 100%; padding: 14px 24px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="badge">Domain Update</div>

  <h1>This site has moved.</h1>

  <p>We've relocated to a new address. The old domain is no longer active — please update your bookmarks.</p>

  <div class="domain-box">
    <div class="domain-label">New address</div>
    <a href="https://echomarket-buyer.vercel.app/" class="domain-link" target="_blank" rel="noopener">
      echomarket-buyer.vercel.app
    </a>
  </div>

  <a href="https://echomarket-buyer.vercel.app/" class="btn" target="_blank" rel="noopener">
    Continue to new site
  </a>

  <p class="note">
    Redirecting automatically in <span class="countdown" id="countdown">10</span>s
  </p>
</div>

<script>
  let seconds = 10;
  const el = document.getElementById('countdown');

  const timer = setInterval(() => {
    seconds--;
    el.textContent = seconds;
    if (seconds <= 0) {
      clearInterval(timer);
      window.location.href = "https://echomarket-buyer.vercel.app/";
    }
  }, 1000);
</script>

</body>
</html>
