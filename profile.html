<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Profile - Echo UA</title>
    <link rel="icon" type="image/png" href="echo_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    animation: {
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.2s ease-out',
                    },
                    keyframes: {
                        slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0A0A0B;
            color: #F8FAFC;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(10,10,11,0.75) 0%, rgba(10,10,11,0.92) 100%);
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            z-index: -1;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(201, 169, 97, 0.25); border-radius: 999px; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border: 1px solid rgba(255,255,255,0.10); }
        .glass-dark { background: rgba(10,10,11,0.55); backdrop-filter: blur(24px) saturate(140%); -webkit-backdrop-filter: blur(24px) saturate(140%); border: 1px solid rgba(255,255,255,0.08); }
        .glass-gold { background: rgba(201,169,97,0.08); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border: 1px solid rgba(201,169,97,0.25); }
        .text-gold-gradient { background: linear-gradient(135deg, #E5D4A1 0%, #C9A961 50%, #A8894A 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="selection:bg-[#C9A961]/30 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ALLIANCES = ['Kyra', 'Proxima', 'Aegis', 'Elysium', 'Rhea', 'Vilis', 'Elion', 'Aura'];
        const LS_AIRLINES = 'echo_airlines_list';
        const LS_ACTIVE = 'echo_active_airline';
        const LS_NOTIF_PERM = 'echo_notif_permission_asked';

        function ProfileApp() {
            const [airlines, setAirlines] = useState([]);
            const [activeAirlineIndex, setActiveAirlineIndex] = useState(-1);
            const [isChangeAirlineOpen, setIsChangeAirlineOpen] = useState(false);
            const [isAddAirlineOpen, setIsAddAirlineOpen] = useState(false);
            const [newAirlineInput, setNewAirlineInput] = useState('');
            const [newAirlineAlliance, setNewAirlineAlliance] = useState('');
            const [toastMessage, setToastMessage] = useState(null);
            const [notifPermission, setNotifPermission] = useState('default');

            // Load dari localStorage
            useEffect(() => {
                try {
                    const storedAirlines = JSON.parse(localStorage.getItem(LS_AIRLINES) || '[]');
                    const storedActive = parseInt(localStorage.getItem(LS_ACTIVE) || '-1', 10);
                    if (Array.isArray(storedAirlines) && storedAirlines.length > 0) {
                        const normalized = storedAirlines.map(a => ({ name: a.name || '', alliance: a.alliance || '' }));
                        setAirlines(normalized);
                        setActiveAirlineIndex(storedActive >= 0 && storedActive < normalized.length ? storedActive : 0);
                    }
                } catch (e) { console.error(e); }
                if ('Notification' in window) setNotifPermission(Notification.permission);
            }, []);

            // Simpan ke localStorage
            useEffect(() => {
                if (airlines.length > 0 || localStorage.getItem(LS_AIRLINES)) {
                    localStorage.setItem(LS_AIRLINES, JSON.stringify(airlines));
                    localStorage.setItem(LS_ACTIVE, String(activeAirlineIndex));
                }
            }, [airlines, activeAirlineIndex]);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

            // Prevent body scroll when modal open
            useEffect(() => {
                const anyOpen = isChangeAirlineOpen || isAddAirlineOpen;
                document.body.style.overflow = anyOpen ? 'hidden' : '';
                return () => { document.body.style.overflow = ''; };
            }, [isChangeAirlineOpen, isAddAirlineOpen]);

            // Close modal on Escape
            useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') {
                        if (isChangeAirlineOpen) setIsChangeAirlineOpen(false);
                        else if (isAddAirlineOpen) setIsAddAirlineOpen(false);
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [isChangeAirlineOpen, isAddAirlineOpen]);

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3000); };
            const customAlert = (title, message) => window.alert(`⚠️ ${title}\n\n${message}`);

            const currentAirline = airlines[activeAirlineIndex] || { name: '', alliance: '' };

            const addAirline = () => {
                const trimmed = newAirlineInput.trim();
                if (!trimmed) { customAlert('Empty Name', 'Please enter a valid airline name.'); return; }
                if (airlines.length >= 6) { customAlert('Limit Reached', 'Max 6 airlines.'); return; }
                if (airlines.some(a => a.name.toLowerCase() === trimmed.toLowerCase())) { customAlert('Duplicate Name', 'Airline already exists.'); return; }
                const newList = [...airlines, { name: trimmed, alliance: newAirlineAlliance }];
                setAirlines(newList);
                setActiveAirlineIndex(newList.length - 1);
                setNewAirlineInput(''); setNewAirlineAlliance('');
                setIsAddAirlineOpen(false);
                showToast(`Airline "${trimmed}" added!`);
            };

            const updateCurrentAirlineName = (newName) => {
                const trimmed = newName.trim();
                if (!trimmed) return;
                if (airlines.some((a, i) => i !== activeAirlineIndex && a.name.toLowerCase() === trimmed.toLowerCase())) return;
                const newList = [...airlines];
                newList[activeAirlineIndex] = { ...newList[activeAirlineIndex], name: trimmed };
                setAirlines(newList);
            };

            const updateCurrentAirlineAlliance = (alliance) => {
                const newList = [...airlines];
                newList[activeAirlineIndex] = { ...newList[activeAirlineIndex], alliance };
                setAirlines(newList);
            };

            const changeAirline = (index) => {
                setActiveAirlineIndex(index);
                setIsChangeAirlineOpen(false);
                showToast(`Switched to "${airlines[index].name}"`);
            };

            const removeAirline = (index) => {
                if (airlines.length <= 1) { customAlert('Cannot Remove', 'Keep at least one airline.'); return; }
                if (!window.confirm(`Remove airline "${airlines[index].name}"?`)) return;
                const newList = airlines.filter((_, i) => i !== index);
                setAirlines(newList);
                let newActive = activeAirlineIndex;
                if (index === activeAirlineIndex) newActive = 0;
                else if (index < activeAirlineIndex) newActive = activeAirlineIndex - 1;
                setActiveAirlineIndex(newActive);
                setIsChangeAirlineOpen(false);
                showToast('Airline removed.');
            };

            const notifGranted = notifPermission === 'granted';
            const notifDenied = notifPermission === 'denied';
            const notifDefault = notifPermission === 'default';

            return (
                <div className="min-h-screen text-slate-100 max-w-2xl mx-auto p-4 md:p-8">

                    {toastMessage && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[60] w-[90%] max-w-sm animate-slide-up">
                            <div className="glass-dark text-white font-bold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
                                <div className="w-7 h-7 rounded-full bg-[#C9A961]/20 border border-[#C9A961]/40 text-[#C9A961] flex items-center justify-center font-black">e.</div>
                                <span className="text-xs">{toastMessage}</span>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <div className="flex items-center justify-between border-b border-white/5 pb-3 mb-5">
                        <a href="index.html" className="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-[#C9A961] transition-colors">
                            <i data-lucide="arrow-left" className="w-4 h-4"></i> Back to Store
                        </a>
                        <h2 className="font-extrabold text-sm text-slate-100">Operator Profile</h2>
                    </div>

                    {/* Profile Card */}
                    <div className="glass p-6 rounded-3xl space-y-5">
                        <div className="flex items-center justify-between border-b border-white/5 pb-4">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 rounded-2xl bg-[#C9A961]/20 border border-[#C9A961]/40 flex items-center justify-center text-[#E5D4A1]">
                                    <i data-lucide="building-2" className="w-7 h-7"></i>
                                </div>
                                <div>
                                    <h3 className="font-black text-lg text-slate-100">{currentAirline.name || 'No Airline Selected'}</h3>
                                    <p className="text-xs text-slate-400 font-medium">{airlines.length > 0 ? `${airlines.length}/6 Airlines Registered` : 'Registered Fleet Operator'}</p>
                                </div>
                            </div>
                            <button onClick={() => setIsChangeAirlineOpen(true)} className="px-3 py-2 rounded-xl glass border-white/10 text-slate-200 text-[11px] font-extrabold hover:bg-white/10 flex items-center gap-1.5">
                                <i data-lucide="repeat" className="w-3.5 h-3.5"></i> Change
                            </button>
                        </div>

                        {/* Notification Status */}
                        <div className={`p-3.5 rounded-2xl border flex items-center justify-between gap-3 ${notifGranted ? 'bg-emerald-500/5 border-emerald-500/20' : notifDenied ? 'bg-rose-500/5 border-rose-500/20' : 'glass border-white/5'}`}>
                            <div className="flex items-center gap-3 min-w-0">
                                <div className={`w-9 h-9 rounded-xl flex items-center justify-center border shrink-0 ${notifGranted ? 'bg-emerald-500/10 border-emerald-500/20' : notifDenied ? 'bg-rose-500/10 border-rose-500/20' : 'bg-white/5 border-white/10'}`}>
                                    <i data-lucide={notifGranted ? 'bell-ring' : 'bell-off'} className={`w-4 h-4 ${notifGranted ? 'text-emerald-400' : notifDenied ? 'text-rose-400' : 'text-slate-400'}`}></i>
                                </div>
                                <div className="min-w-0">
                                    <p className="text-xs font-extrabold text-slate-100">Device Notifications</p>
                                    <p className="text-[10px] text-slate-400 font-bold truncate">
                                        {notifGranted ? 'Enabled • Alerts on order updates' : notifDenied ? 'Blocked • Enable from browser settings' : 'Not enabled yet'}
                                    </p>
                                </div>
                            </div>
                            {notifGranted && <span className="text-[10px] font-black text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-full shrink-0">ON</span>}
                            {notifDenied && <span className="text-[10px] font-black text-rose-400 bg-rose-500/10 border border-rose-500/20 px-2.5 py-1 rounded-full shrink-0">OFF</span>}
                            {notifDefault && <span className="text-[10px] font-black text-slate-400 glass border-white/10 px-2.5 py-1 rounded-full shrink-0">OFF</span>}
                        </div>

                        {airlines.length === 0 ? (
                            <div className="p-4 rounded-2xl bg-black/30 border border-white/5 text-center space-y-3">
                                <div className="w-12 h-12 rounded-full bg-white/5 border border-white/10 text-slate-400 flex items-center justify-center mx-auto">
                                    <i data-lucide="user-plus" className="w-6 h-6"></i>
                                </div>
                                <p className="text-xs font-bold text-slate-300">No Airline Registered Yet</p>
                                <p className="text-[11px] text-slate-500">You must register an airline before placing any order.</p>
                                <button onClick={() => setIsAddAirlineOpen(true)} className="px-4 py-2.5 rounded-xl bg-[#C9A961] text-black text-xs font-extrabold hover:bg-[#E5D4A1] transition-all">+ Add Airline</button>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div className="space-y-2">
                                    <label className="text-xs font-extrabold text-slate-300 block">Airline Name</label>
                                    <input type="text" value={currentAirline.name} onChange={(e) => updateCurrentAirlineName(e.target.value)}
                                        placeholder="Enter your airline name..."
                                        className="w-full glass text-slate-100 placeholder-slate-600 rounded-2xl px-4 py-3 text-xs font-bold focus:outline-none focus:border-[#C9A961]/50" />
                                </div>
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center">
                                        <label className="text-xs font-extrabold text-slate-300 block">Alliance</label>
                                        <span className="text-[10px] font-black glass border-white/10 text-slate-300 px-2 py-0.5 rounded-md">Required</span>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                        {ALLIANCES.map(al => (
                                            <button key={al} onClick={() => updateCurrentAirlineAlliance(al)}
                                                className={`py-2 px-3 rounded-xl text-xs font-black transition-all border ${currentAirline.alliance === al ? 'bg-[#C9A961] text-black border-[#C9A961] shadow' : 'glass text-slate-400 border-white/10 hover:border-[#C9A961]/40'}`}>
                                                {al}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                <button onClick={() => setIsAddAirlineOpen(true)} disabled={airlines.length >= 6}
                                    className={`w-full py-3 rounded-2xl border text-xs font-black shadow-md transition-all flex items-center justify-center gap-2 ${airlines.length >= 6 ? 'glass border-white/5 text-slate-600 cursor-not-allowed' : 'glass border-white/10 text-slate-100 hover:bg-white/10'}`}>
                                    <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                                    {airlines.length >= 6 ? 'Maximum 6 Airlines Reached' : `Add New Airline (${airlines.length}/6)`}
                                </button>
                            </div>
                        )}
                    </div>

                    {/* ============ CHANGE AIRLINE MODAL ============ */}
                    {isChangeAirlineOpen && (
                        <div className="fixed inset-0 z-[95] bg-black/80 backdrop-blur-md flex items-end md:items-center justify-center animate-slide-up p-0 md:p-4">
                            <div className="glass-dark border-t md:border border-white/10 w-full max-w-md rounded-t-3xl md:rounded-3xl p-5 space-y-4 shadow-2xl max-h-[80vh] overflow-y-auto">
                                <div className="w-10 h-1 rounded-full bg-white/20 mx-auto md:hidden"></div>
                                <div className="flex justify-between items-center border-b border-white/5 pb-3">
                                    <div className="flex items-center gap-2">
                                        <i data-lucide="repeat" className="w-5 h-5 text-[#C9A961]"></i>
                                        <h3 className="font-extrabold text-base text-slate-100">Change Airline</h3>
                                    </div>
                                    <button onClick={() => setIsChangeAirlineOpen(false)} className="w-7 h-7 rounded-full glass text-slate-400 flex items-center justify-center hover:bg-white/10">
                                        <i data-lucide="x" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div className="space-y-2">
                                    {airlines.length === 0 ? (
                                        <div className="p-6 text-center space-y-3">
                                            <p className="text-xs text-slate-400 font-bold">No airlines registered yet.</p>
                                            <button onClick={() => { setIsChangeAirlineOpen(false); setIsAddAirlineOpen(true); }} className="px-4 py-2 rounded-xl bg-[#C9A961] text-black text-xs font-extrabold">
                                                + Add Your First Airline
                                            </button>
                                        </div>
                                    ) : (
                                        airlines.map((a, i) => (
                                            <div key={i} className={`p-3 rounded-2xl border flex items-center justify-between transition-all ${i === activeAirlineIndex ? 'glass-gold' : 'bg-black/30 border-white/5 hover:border-white/10'}`}>
                                                <button onClick={() => changeAirline(i)} className="flex items-center gap-3 flex-1 text-left">
                                                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-xs font-black ${i === activeAirlineIndex ? 'bg-[#C9A961] text-black' : 'bg-white/5 border border-white/10 text-slate-400'}`}>
                                                        {a.name.charAt(0).toUpperCase()}
                                                    </div>
                                                    <div>
                                                        <p className="text-xs font-extrabold text-slate-100">{a.name}</p>
                                                        <p className="text-[10px] text-slate-500 font-bold">{a.alliance || 'No Alliance'} • {i === activeAirlineIndex ? 'Active' : 'Tap to switch'}</p>
                                                    </div>
                                                </button>
                                                <button onClick={() => removeAirline(i)} className="w-8 h-8 rounded-lg glass text-slate-500 hover:text-red-400 hover:border-red-500/40 flex items-center justify-center transition-all">
                                                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <button onClick={() => { setIsChangeAirlineOpen(false); setIsAddAirlineOpen(true); }} disabled={airlines.length >= 6}
                                    className={`w-full py-3 rounded-2xl border text-xs font-black shadow-md transition-all flex items-center justify-center gap-2 ${airlines.length >= 6 ? 'glass border-white/5 text-slate-600 cursor-not-allowed' : 'glass border-white/10 text-slate-100 hover:bg-white/10'}`}>
                                    <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                                    {airlines.length >= 6 ? 'Maximum 6 Airlines Reached' : 'Add New Airline'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ============ ADD AIRLINE MODAL ============ */}
                    {isAddAirlineOpen && (
                        <div className="fixed inset-0 z-[95] bg-black/80 backdrop-blur-md flex items-end md:items-center justify-center animate-slide-up p-0 md:p-4">
                            <div className="glass-dark border-t md:border border-white/10 w-full max-w-md rounded-t-3xl md:rounded-3xl p-5 space-y-4 shadow-2xl">
                                <div className="w-10 h-1 rounded-full bg-white/20 mx-auto md:hidden"></div>
                                <div className="flex justify-between items-center border-b border-white/5 pb-3">
                                    <div className="flex items-center gap-2">
                                        <i data-lucide="user-plus" className="w-5 h-5 text-[#C9A961]"></i>
                                        <h3 className="font-extrabold text-base text-slate-100">Register New Airline</h3>
                                    </div>
                                    <button onClick={() => { setIsAddAirlineOpen(false); setNewAirlineInput(''); }} className="w-7 h-7 rounded-full glass text-slate-400 flex items-center justify-center hover:bg-white/10">
                                        <i data-lucide="x" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div className="space-y-3">
                                    <div className="space-y-2">
                                        <label className="text-xs font-extrabold text-slate-300 block">Airline Name</label>
                                        <input type="text" value={newAirlineInput} onChange={(e) => setNewAirlineInput(e.target.value)}
                                            onKeyDown={(e) => e.key === 'Enter' && addAirline()} placeholder="e.g. Echo Airways" autoFocus
                                            className="w-full glass text-slate-100 placeholder-slate-600 rounded-2xl px-4 py-3 text-xs font-bold focus:outline-none focus:border-[#C9A961]/50" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-xs font-extrabold text-slate-300 block">Alliance</label>
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                            {ALLIANCES.map(al => (
                                                <button key={al} onClick={() => setNewAirlineAlliance(al)}
                                                    className={`py-2 px-2 rounded-xl text-[11px] font-black transition-all border ${newAirlineAlliance === al ? 'bg-[#C9A961] text-black border-[#C9A961] shadow' : 'glass text-slate-400 border-white/10 hover:border-[#C9A961]/40'}`}>
                                                    {al}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <p className="text-[10px] text-slate-500 font-semibold">You can register up to 6 airlines. Currently: {airlines.length}/6</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => { setIsAddAirlineOpen(false); setNewAirlineInput(''); }} className="flex-1 py-3 rounded-2xl glass border-white/10 text-slate-300 text-xs font-extrabold hover:bg-white/10">Cancel</button>
                                    <button onClick={addAirline} className="flex-1 py-3 rounded-2xl bg-[#C9A961] hover:bg-[#E5D4A1] text-black text-xs font-extrabold">Add Airline</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<ProfileApp />);
    </script>
</body>
</html>
